    name: Open Data Regione Toscana CKAN Action API
    description: >-
      CKAN Action API for Open Data Regione Toscana, a consistent JSON-over-HTTP interface over a catalog of 12,382 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://dati.toscana.it/api/3/action/.
