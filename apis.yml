aid: dati-toscana-it
name: Open Data Regione Toscana
description: >-
  Open Data Regione Toscana is a open data portal open-data portal for Italy running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 12,382 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
